services:
  tgate:
    build:
      context: ../services/tgate
      dockerfile: Dockerfile
    container_name: cor-tgate
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/on"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./telegram_session:/telegram-session
    networks:
      - cornet

  tgfetch:
    build:
      context: ../services/tgfetch
      dockerfile: Dockerfile
    container_name: cor-tgfetch
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
      - tgate
    env_file: .env
    environment:
      TGATE_BASE_URL: http://tgate:3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: coradio
      POSTGRES_USER: coradio
      POSTGRES_PASSWORD: coradio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minio
      STORAGE_SECRET_KEY: minio123
      STORAGE_BUCKET: cold-orbit-radio
      TELEGRAM_CHANNEL_NAME: ${TELEGRAM_CHANNEL_NAME}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8080:8080"
    networks:
    - cornet

  postgres:
    image: postgres:16
    container_name: cor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coradio
      POSTGRES_USER: coradio
      POSTGRES_PASSWORD: coradio
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cornet

  minio:
    image: minio/minio
    container_name: cor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - cornet

volumes:
  postgres-data:
  minio-data:
  telegram-session:
  
networks:
  cornet:
    name: cornet
    driver: bridge
