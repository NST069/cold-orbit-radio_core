services:
  tgate:
    image: cor-tgate:2026.08.17-1
    container_name: cor-tgate
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/on"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./telegram-session:/telegram-session
    networks:
      - cornet

  tgfetch:
    image: cor-tgfetch:2026.08.17-1
    container_name: cor-tgfetch
    restart: unless-stopped
    depends_on:
      - tgate
    env_file: .env
    environment:
      TGATE_BASE_URL: http://tgate:3000
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      TELEGRAM_CHANNEL_NAME: ${TELEGRAM_CHANNEL_NAME}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
    networks:
      - cornet

networks:
  cornet:
    name: cornet
    driver: bridge
