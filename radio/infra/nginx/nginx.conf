events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;

    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        application/xml;
    
    # HTTP -> HTTPS редирект
    server {
        listen 80;
        listen [::]:80;
        server_name coldorbitradio.duckdns.org;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }
    
    # HTTPS сервер
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name coldorbitradio.duckdns.org;
        
        # SSL сертификаты
        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;
        
        # Безопасные настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        
        # Прокси на rotation
        location /api/ {

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://rotation:8080/api/v1/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Прокси на icecast
        location ~ ^/(radio\.mp3|stream|listen)$ {
            proxy_pass http://icecast:8000;
            proxy_set_header Host $host;

            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            
            # Для аудиопотоков
            proxy_read_timeout 3600s;
            
            # CORS
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
        }

        # Статус Icecast
        location /status-json.xsl {
            proxy_pass http://icecast:8000/status-json.xsl;
        }

        # Статус nginx
        location /health {
            return 200 "OK";
        }
    }
}
