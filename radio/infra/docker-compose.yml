services:
  rotation:
    build:
      context: ../services/rotation
      dockerfile: Dockerfile
    container_name: cor-rotation
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: cold-orbit-radio
      STORAGE_LOCAL_PATH: /app/music
      LIQUIDSOAP_HOST: liquidsoap 
      LIQUIDSOAP_PORT: 1234
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8080:8080"
    volumes:
      - music-cache:/app/music
    networks:
    - cornet
        
  liquidsoap:
    image: savonet/liquidsoap:v2.1.3
    container_name: cor-liquidsoap
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.4
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - music-cache:/app/music
      - ../shared/liquidsoap:/app/liquidsoap
    command: >
      liquidsoap /app/liquidsoap/radio.liq
    depends_on:
      - icecast
    ports:
      - "4000:4000"
      - "1234:1234"
    networks:
      - cornet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  icecast:
    image: moul/icecast
    container_name: cor_icecast
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    env_file: .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "8000:8000"
    networks:
      - cornet
      
volumes:
  music-cache:
  
networks:
  cornet:
    name: cornet
    driver: bridge