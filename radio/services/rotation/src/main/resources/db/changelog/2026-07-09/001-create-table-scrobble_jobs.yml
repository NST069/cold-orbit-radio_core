databaseChangeLog:
  - changeSet:
      id: create-table-scrobble_jobs
      author: NiKryukov
      changes:
        - createTable:
            tableName: scrobble_jobs
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_scrobble_job_id
              - column:
                  name: playback_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: timestamptz
              - column:
                  name: sent_at
                  type: timestamptz
              - column:
                  name: attempts
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: error
                  type: text

        - addForeignKeyConstraint:
            baseTableName: scrobble_jobs
            baseColumnNames: playback_id
            referencedTableName: playback_history
            referencedColumnNames: id
            constraintName: fk_scrobble_jobs_to_playback_history
