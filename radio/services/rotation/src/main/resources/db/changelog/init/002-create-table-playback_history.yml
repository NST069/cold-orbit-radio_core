databaseChangeLog:
  - changeSet:
      id: create-table-playback_history
      author: NiKryukov
      changes:
        - createTable:
            tableName: playback_history
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_playback_history_id
              - column:
                  name: track_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: artist
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: played_at
                  type: timestamptz
                  constraints:
                    nullable: false