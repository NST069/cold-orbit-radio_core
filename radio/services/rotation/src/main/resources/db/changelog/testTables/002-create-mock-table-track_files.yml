databaseChangeLog:
  - changeSet:
      id: create-track-files
      author: NiKryukov
      context: test
      changes:
        - createTable:
            tableName: track_files
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: track_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: varchar(1024)
              - column:
                  name: status
                  type: varchar(50)
        - addForeignKeyConstraint:
            baseTableName: track_files
            baseColumnNames: track_id
            referencedTableName: tracks
            referencedColumnNames: id
            constraintName: fk_track_files_track
