databaseChangeLog:
  - changeSet:
      id: create-table-track_stats
      author: NiKryukov
      changes:
        - createTable:
            tableName: track_stats
            columns:
              - column:
                  name: track_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_track_stats_id
              - column:
                  name: plays
                  type: number
                  defaultValue: "0"
                  constraints:
                    nullable: false
              - column:
                  name: likes
                  type: number
                  defaultValue: "0"
                  constraints:
                    nullable: false
