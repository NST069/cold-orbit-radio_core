databaseChangeLog:
  - changeSet:
      id: create-table-track_queue
      author: NiKryukov
      changes:
        - createTable:
            tableName: track_queue
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_track_queue_id
              - column:
                  name: track_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: local_path
                  type: text
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
